plugins {
    id 'com.android.application'
}

android {
    namespace 'com.yourpackage.batterywallpaper'
    compileSdk 34

    defaultConfig {
        applicationId "com.yourpackage.batterywallpaper"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.preference:preference:1.2.1'
}
